name: Release

on:
  push:
    branches: [ master ]
    # tags:
    #   - '*'

jobs:
  create_release:
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write
    steps:
      - name: Run Release Drafter
        uses: release-drafter/release-drafter@v5
        with:
          config-name: release-drafter.yml
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
